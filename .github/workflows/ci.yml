name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein laufender Check pro Branch reicht.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
