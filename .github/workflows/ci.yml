name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Von Hand auslösbar. Gelegentlich legt GitHub für einen Pull Request keinen
  # Lauf an – dann lässt er sich hier nachholen, statt einen leeren Commit zu
  # schieben.
  workflow_dispatch:

# Ein laufender Check pro Branch reicht.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Die Regel-Vorlage lässt sich nicht mit Vitest prüfen – sie ist kein
      # JavaScript. Dass sie sich überhaupt erzeugen lässt, aber schon: Ohne
      # diesen Schritt fiele ein kaputter Platzhalter erst beim Deployen auf.
      - name: Firestore-Regeln probeweise erzeugen
        env:
          HB_ADMIN_EMAIL: probe@example.com
        run: npm run rules
