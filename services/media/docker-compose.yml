# Container Station auf dem QNAP: "Anwendung erstellen" und diese Datei einfügen.
# Die Werte in .env danebenlegen (siehe .env.example).
#
# Das Image kommt fertig gebaut aus der GitHub Container Registry – auf dem NAS
# wird nichts mehr kompiliert und es braucht dort auch keinen Quelltext:
#
#   Holen und starten:      docker compose pull && docker compose up -d
#   Mit Tunnel:             docker compose --profile tunnel up -d
#
# Danach hält sich der Dienst selbst aktuell: Ein Wächter sieht alle paar
# Minuten nach, ob GitHub ein neues Image gebaut hat, und startet hb-media
# damit neu. Am NAS ist dafür nichts mehr zu tun.
#
# Läuft auf dem NAS schon ein Wächter für andere Dienste, übernimmt der das –
# hb-media trägt dafür nur das Label unten. Wo keiner läuft:
#
#   Eigenen Wächter mitstarten:  docker compose --profile waechter up -d
#
# Selber bauen geht weiterhin (etwa zum Ausprobieren einer Änderung):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build

services:
  hb-media:
    # HB_IMAGE überschreibt das Image, z. B. auf eine bestimmte Kennung
    # (`ghcr.io/…/hb-media:1a2b3c4`), um einen Stand zurückzunehmen.
    image: ${HB_IMAGE:-ghcr.io/vonallmenalain/hb-media:latest}
    container_name: hb-media
    restart: unless-stopped
    labels:
      # Ein Wächter, der mit `--label-enable` läuft, fasst nur Container mit
      # diesem Label an. Viele NAS haben einen solchen schon für ihre übrigen
      # Dienste – dann genügt diese Zeile, und es braucht hier keinen zweiten.
      # Ohne einen solchen Wächter tut das Label nichts.
      com.centurylinklabs.watchtower.enable: 'true'
    ports:
      # Vorgabe 18080 und nicht 8080: Auf dem QNAP gehört 8080 der
      # QTS-Weboberfläche, und der Start scheitert dann mit
      # „address already in use" – auch wenn HB_HOST_PORT in der .env nur leer
      # steht. Der Port hier ist ohnehin nur für den Blick von aussen; der
      # Tunnel spricht den Dienst containerintern auf 8080 an.
      - '${HB_HOST_PORT:-18080}:8080'
    volumes:
      # Hörbuch-Ordner nur lesend – der Dienst schreibt dort nie hinein.
      - ${HB_LIBRARY_PATH:?HB_LIBRARY_PATH fehlt}:/media:ro
      - hb-cache:/cache
    environment:
      HB_FIREBASE_PROJECT_ID: ${HB_FIREBASE_PROJECT_ID:?}
      HB_TICKET_SECRET: ${HB_TICKET_SECRET:?}
      HB_ALLOWED_ORIGINS: ${HB_ALLOWED_ORIGINS:?}
      HB_ALLOWED_UIDS: ${HB_ALLOWED_UIDS:-}
      HB_ADMIN_UIDS: ${HB_ADMIN_UIDS:-}
      HB_TICKET_TTL_SECONDS: ${HB_TICKET_TTL_SECONDS:-28800}
      HB_RESCAN_INTERVAL_MINUTES: ${HB_RESCAN_INTERVAL_MINUTES:-360}
      HB_SCAN_ON_START: ${HB_SCAN_ON_START:-true}

  # Cloudflare Tunnel: macht den Dienst ohne offenen Port erreichbar.
  # Das Token stammt aus dem Cloudflare-Dashboard (Zero Trust → Networks →
  # Tunnels).
  #
  # Liegt im Profil "tunnel" und startet deshalb nur bei --profile tunnel. So
  # läuft der Medien-Dienst schon, bevor der Tunnel existiert – und wer einen
  # anderen Weg nimmt (myQNAPcloud, Tailscale), lässt das Profil einfach weg.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hb-tunnel
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - hb-media

  # Holt neue Images von selbst und startet hb-media damit neu – für ein NAS,
  # auf dem noch kein Wächter läuft.
  #
  # Im Profil `waechter`, weil er nur dort hingehört, wo noch gar kein Wächter
  # läuft. Wo einer läuft, erfasst er hb-media meist ohnehin – ohne Filter
  # nimmt Watchtower alle Container mit, und mit `--label-enable` greift das
  # Label oben. Ob er es tut, verraten Argumente und Umgebung zusammen:
  #
  #   docker ps --filter ancestor=containrrr/watchtower --format '{{.Names}}'
  #   docker inspect <name> --format 'CMD: {{join .Config.Cmd " "}}
  #   ENV: {{join .Config.Env " "}}'
  #
  # Erfasst er hb-media nicht (eigene Namensliste, `--scope`), gehört das dort
  # geradegerückt und nicht hier (docs/QNAP-SETUP.md §9).
  #
  # Nie zwei Wächter nebeneinander: Watchtower sucht beim Start nach weiteren
  # Instanzen und stoppt sie. Aus einem zweiten Wächter für hb-media wird so
  # ein Ausfall der Aktualisierung für alle anderen Dienste auf dem NAS –
  #
  #   msg="Found multiple running watchtower instances. Cleaning up."
  #   msg="Stopping /manager-watchtower (0c9b877b08c4) with SIGTERM"
  #
  # und das fällt erst auf, wenn Wochen später irgendwo ein alter Stand läuft.
  #
  # Was der Wächter kostet, steht in docs/QNAP-SETUP.md §9: Er braucht den
  # Docker-Socket und darf damit alles, was Docker auf dem NAS darf.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: hb-watchtower
    profiles: ['waechter']
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Nur hb-media, nichts anderes auf dem NAS. `--cleanup` wirft das alte
    # Image weg, sonst füllt sich die Platte mit jeder Version.
    #
    # Fünf Minuten sind der Abstand zwischen „GitHub ist fertig" und „läuft auf
    # dem NAS". Der Neustart dauert Sekunden; wer ihn nie zur Hörzeit riskieren
    # will, setzt HB_UPDATE_INTERVAL_SECONDS hoch – dann sieht der Wächter
    # entsprechend seltener nach.
    command: --interval ${HB_UPDATE_INTERVAL_SECONDS:-300} --cleanup hb-media

volumes:
  # Katalog, gelesene ID3-Daten und aufbereitete Cover. Überlebt Updates und
  # Neustarts – ohne das Volume liest der erste Start die ganze Bibliothek neu.
  hb-cache:
