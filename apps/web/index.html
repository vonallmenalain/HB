<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hörbücher</title>
    <meta name="description" content="Hörbücher für Kinder – einfach auswählen, immer dort weiterhören, wo du aufgehört hast." />
    <meta name="theme-color" content="#6d28d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      iOS liest das Manifest für den Vollbildmodus nicht; dort entscheiden diese
      beiden Zeilen. „black-translucent" legt die Seite unter die Statusleiste –
      zusammen mit `viewport-fit=cover` oben und den sicheren Bereichen in
      `Screen` bleibt trotzdem nichts hinter der Uhr verborgen.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
